[extend]
useDefault = true

# Allowlist — exempts ONLY the CI-job-scoped master key, by exact value and by
# path. Deliberately NOT a broad `mem_*` or "any Bearer token" pattern: this
# service's real credentials are `mem_` + 43 url-safe base64 chars, and a
# prefix rule would suppress a genuine one committed anywhere in the repo.
#
# What is exempted and why: `.github/workflows/ci.yml`'s image job starts the
# container with a fixed hash and then authenticates one request against
# 127.0.0.1 inside the same ephemeral runner, to prove the shipped image can
# serve a real authenticated request (the `/docs` probe it replaced certified
# an image that 500'd on everything else). The plaintext and its sha256 are
# both public by design and authenticate nothing outside that job.
[[rules]]
id = "curl-auth-header"
description = "Bearer token on a curl command line"
regex = '''-H ["']Authorization: Bearer [^"'$][^"']*["']'''
[rules.allowlist]
paths = ['''(^|/)\.github/workflows/ci\.yml$''']
regexTarget = "match"
regexes = ['''Bearer ci-master-key''']

# NOTE ON ANCHORING: `regexTarget = "match"` tests the whole matched SPAN,
# which for the default rules includes the assignment prefix
# (`MEMORY_MASTER_KEY_HASH="edc1..."`), not the bare value. An anchored
# `^value$` therefore never matches, which is why the entries below are
# unanchored exact literals. They are still exact: each names the one string
# it exempts, so a real credential of any other shape still trips the gate.
[[allowlists]]
description = "CI-only master key, scoped to the workflow that creates it"
# AND, matching what the comment above has always claimed: the exemption is
# the exact value AND the one workflow file, never "anything inside ci.yml".
condition = "AND"
paths = ['''(^|/)\.github/workflows/ci\.yml$''']
regexTarget = "match"
regexes = [
  # sha256("ci-master-key") — the hash the CI container is started with.
  '''edc1d6f618e2c53cbcb9f859d548c9ad19f60663eb2a738d5f0a57a9fdca451c''',
  '''ci-master-key''',
]

# False positives from gitleaks' generic `generic-api-key` heuristic, which
# fires on any long-ish hyphenated literal near an assignment. These live in
# committed history as well as the working tree, so a path-only exemption
# would not clear `detect` over the git log.
[[allowlists]]
description = "Non-secret literals the generic heuristic mistakes for keys"
regexTarget = "match"
regexes = [
  # src/memory/delivery.py's tokenizer contract, asserted verbatim by
  # tests/test_delivery.py and quoted in the plan that introduced it.
  '''ach-delivery-o200k-v1''',
  # A project slug fixture in tests/test_models.py, not a key. Kept with its
  # trailing context so the exemption cannot cover a bare value elsewhere.
  '''payments-api", is_canonical''',
]

# The synthetic canary transcripts the sanitizer tests were built from. The
# files are deleted, but `detect` still walks the commits that carried them,
# and history cannot be edited to satisfy a scanner. Every value in them was
# generated to LOOK like a credential so the redaction path could be proven
# against one; none ever authenticated anything.
[[allowlists]]
description = "Deleted synthetic canary fixtures, still present in history"
paths = [
  '''(^|/)tests/fixtures/claude-transcripts/.*\.jsonl$''',
  '''(^|/)tests/test_capture_e2e\.py$''',
  '''(^|/)tests/test_phase3_review_closure\.py$''',
]

# tests/test_sanitization.py proves the keyword=value rule against values
# that pass its gate -- 10+ credential characters at 3.5+ bits of entropy --
# which is gitleaks' own generic-api-key gate ported, so every such fixture
# trips this scanner by construction. Exact values AND the one file, like the
# CI key above; none ever authenticated anything.
[[allowlists]]
description = "Credential-shaped fixtures for the sanitizer's entropy gate"
condition = "AND"
paths = ['''(^|/)tests/test_sanitization\.py$''']
regexTarget = "match"
regexes = [
  '''q7Hx2mZp9LkT4vRw''',
  '''3f9a1c7e2b8d4f6a9c0e1b2d3f4a5c6e''',
  '''dGhpcyBpcyBhIHRlc3Q=''',
  '''ghp_x7Fq9Lm2Zt4Rv8Kw1Jn6Hp3Yb5Cd0Aa''',
]

# tests/test_sanitization_shapes.py proves the structural rules (AWS, Google,
# JWT, Stripe, GitLab, Slack) against values shaped exactly like the
# credentials gitleaks' default rules look for, so every one of them trips
# this scanner by construction. Exact values AND the one file, like the CI
# key above; the AWS pair is Amazon's own documentation example and none of
# the others ever authenticated anything.
[[allowlists]]
description = "Credential-shaped fixtures for the sanitizer's structural rules"
condition = "AND"
paths = ['''(^|/)tests/test_sanitization_shapes\.py$''']
regexTarget = "match"
regexes = [
  '''AKIAIOSFODNN7EXAMPLE''',
  '''wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY''',
  '''AIzaSyA-1234567890abcdefghijklmnopqrst_''',
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c''',
  '''sk_live_51H8xYzAbCdEfGh''',
  '''sk-live-AKIA4XPLTESTFAKE9931''',
  '''rk_test_51H8xYzAbCdEfGh''',
  '''glpat-abcdefghijklmnopqrst''',
  '''xapp-1-A0123456789-abcdefghij''',
  '''hooks\.slack\.com/services/TQA0FIXTURE/BQA0FIXTURE/qa-fixture-not-a-token''',
]
