[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

# Deliberately empty. migrations/env.py sets this from MEMORY_DATABASE_URL,
# which is the single source of truth. A hardcoded fallback here meant an
# unset variable silently migrated whatever database this default named --
# a developer's local one, most likely.
sqlalchemy.url =


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
