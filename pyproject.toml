[project]
name = "ach-memory"
version = "0.2.0"
description = "Governed, engine-neutral memory harness for coding agents"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "httpx>=0.28",
    "mcp>=2.0.0",
    "mcp-types>=2.0.0",
    "pyjwt[crypto]>=2.10",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
ach-memory = "memory.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "httpx2>=2.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: requires a live Hindsight on MEMORY_HINDSIGHT_URL",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
    # `Depends(...)` as an argument default is FastAPI's own idiomatic
    # dependency-injection pattern (every route in src/memory/api/* uses it),
    # not the accidental-mutable-default bug this bugbear rule exists to
    # catch. FastAPI's own docs recommend it; see astral-sh/ruff#4429.
    "B008",
]
