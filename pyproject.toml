[project]
name = "ach-memory"
version = "0.7.0"
description = "Governed, engine-neutral memory harness for coding agents"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "httpx>=0.28",
    "mcp>=2.0.0",
    "mcp-types>=2.0.0",
    "pyjwt[crypto]>=2.10",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
ach-memory = "memory.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "httpx2>=2.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory"]


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: requires a live Hindsight on MEMORY_HINDSIGHT_URL",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Ruff's defaults are E4/E7/E9 + F only. B (bugbear) is selected because the
# codebase already carries `# noqa: B006` markers that were silently inert
# without it -- a suppression for a rule that never ran.
extend-select = ["B"]
