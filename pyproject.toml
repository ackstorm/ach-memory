[project]
name = "ach-memory"
version = "0.3.4"
description = "Multi-tenant memory service for coding agents, over Hindsight"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "httpx>=0.28",
    # Mounted in src/memory/api/app.py and imported by src/memory/mcp/* --
    # production code, not test scaffolding. Measured live: the Dockerfile
    # builds with `uv export --no-dev`, so leaving this in the dev group (as
    # it was through Task 7) ships an image that crashes on startup with
    # `ModuleNotFoundError: No module named 'mcp'` -- every unit test run
    # masked it because `uv run pytest` always installs the dev group.
    "mcp>=2.0.0",
    # Imported directly by src/memory/mcp/tools.py (ToolAnnotations), so it is
    # production code -- but it only ever reached the image as a transitive
    # dep of `mcp`. Third instance of the failure mode the two comments above
    # already record: `mcp` mis-grouped, `httpx2` undeclared, this one
    # undeclared. A transitive dep that stops being transitive is a
    # crash-looping container, and the CI import guard only catches it once
    # CI actually runs (see .github/workflows/ci.yml's push trigger).
    "mcp-types>=2.0.0",
    # Only src/memory/mcp/proxy.py (the local stdio forwarder behind
    # `ach-memory mcp`) imports this. It is a hard dep, not an extra,
    # because `uvx ach-memory mcp` must work bare -- an extra would put
    # `--from 'ach-memory[proxy]'` into every host config for zero gain.
    # Pinned to the 4.0.0b* line, not >=3.4: fastmcp 3.x (via fastmcp-slim)
    # pins mcp<2.0, which conflicts with this repo's own mcp>=2.0.0 above --
    # only 4.0.0b* supports mcp>=2.0, so the pre-release is structurally
    # forced, not a stray beta pickup. The <4.1 bound stops a silent
    # beta -> stable-4.x API jump from landing unreviewed.
    "fastmcp>=4.0.0b4,<4.1",
    # Verifies externally-issued identity tokens
    # (memory/auth/providers/jwt_provider.py, added in a later task).
    # [crypto] is not optional for us: ACH signs EdDSA and Dex signs RS256,
    # and PyJWT without the extra supports neither -- it raises
    # "Algorithm 'EdDSA' could not be found" at the first request, not at
    # import, so a missing extra ships as a runtime auth outage.
    "pyjwt[crypto]>=2.10",
    # Exposition format and histogram bucketing for GET /metrics. Production
    # code (src/memory/metrics.py), so it belongs here and not in the dev
    # group -- the same mistake `mcp` and `mcp-types` each shipped once,
    # which crash-looped the image because `uv export --no-dev` dropped them.
    "prometheus-client>=0.21",
]

[project.scripts]
ach-memory = "memory.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.22",
    "ruff>=0.8",
    # scripts/e2e.py imports this directly (MCP's streamable_http_client
    # needs an httpx2.AsyncClient, not httpx's). It only reached the venv as
    # a transitive dep of `mcp` -- declare it, same failure mode as the
    # `mcp` entry above caught once already (undeclared instead of
    # mis-grouped this time).
    "httpx2>=2.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory"]

[tool.hatch.build.targets.wheel.force-include]
# Only the hosts without a marketplace mechanism ship inside the wheel;
# claude and codex install from the repository marketplace itself.
"plugins/opencode" = "memory/integrations/opencode"
"plugins/pi" = "memory/integrations/pi"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: requires a live Hindsight on MEMORY_HINDSIGHT_URL",
]
filterwarnings = [
    # Upstream Starlette nudge toward `httpx2`. That package is real and now
    # declared (see the dev group above, used directly by scripts/e2e.py);
    # this warning is about starlette.testclient specifically, which stays on
    # httpx -- the correct, already-declared dependency (SPEC Task 5 Step 1).
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
    # `Depends(...)` as an argument default is FastAPI's own idiomatic
    # dependency-injection pattern (every route in src/memory/api/* uses it),
    # not the accidental-mutable-default bug this bugbear rule exists to
    # catch. FastAPI's own docs recommend it; see astral-sh/ruff#4429.
    "B008",
]
