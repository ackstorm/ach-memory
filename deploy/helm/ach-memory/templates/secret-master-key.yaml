{{- if not .Values.masterKeySecret.name }}
{{- if not .Values.masterKeySecret.value }}
{{ fail "masterKeySecret.name or masterKeySecret.value is required: MEMORY_MASTER_KEY_HASH is the credential that reaches every bank in the tenant and must never default silently. Set masterKeySecret.name to reference an existing Secret (recommended), or masterKeySecret.value to have the chart create one." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ach-memory.fullname" . }}-master-key
  labels:
    {{- include "ach-memory.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.masterKeySecret.key }}: {{ .Values.masterKeySecret.value | quote }}
{{- end }}
