# Default values for ach-memory.
#
# This chart ships the service only. Postgres and Hindsight are dependencies
# you point it at (config.databaseUrl / config.hindsight.url) -- an in-chart
# database is how test data ends up in production.

image:
  # Must include the registry host. "ach-memory" with no host resolves to
  # docker.io/library/ach-memory, which does not exist -- the migration Job
  # (a pre-install hook) then sits in ImagePullBackOff and `helm install`
  # blocks until the hook times out, leaving the release "pending-install".
  repository: ghcr.io/ackstorm/ach-memory
  tag: ""    # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

# The write-rate limiter (config.writeLimit / config.writeWindowSeconds below)
# is IN-PROCESS, per pod -- it is not shared across replicas. Raising
# replicaCount to N multiplies the effective write-rate ceiling by N. If you
# scale this up, lower writeLimit to compensate or the "60 writes/min" you
# configured becomes "60*N writes/min" in practice.
replicaCount: 1

nameOverride: ""
fullnameOverride: ""

config:
  # MEMORY_DATABASE_URL. Required. Points at a Postgres this chart does not
  # run (e.g. postgresql+psycopg://user:pass@host:5432/memory).
  databaseUrl: ""
  # MEMORY_TENANT_ID. Mono-tenant in v1; scopes our own DB rows only. Never
  # reaches Hindsight -- hindsight-api 0.9.1 hardcodes the literal `default`
  # segment in every bank route (see SPEC-v1.md §19.1).
  tenantId: "default"
  # MEMORY_MAX_CONTENT_BYTES.
  maxContentBytes: 256000
  # MEMORY_WRITE_LIMIT / MEMORY_WRITE_WINDOW_SECONDS -- see the replicaCount
  # comment above: this ceiling is per pod, not per deployment.
  writeLimit: 60
  writeWindowSeconds: 60

  # MEMORY_HINDSIGHT_TIMEOUT_SECONDS / MEMORY_HINDSIGHT_LLM_TIMEOUT_SECONDS.
  # The LLM one covers `sync_retain` and `reflect`, which block on the model
  # Hindsight is configured with -- the deployment-specific knob. Too low and
  # a slow-but-succeeding write returns HINDSIGHT_ERROR (502), which tells an
  # agent to retry while the upstream worker completes the original write
  # anyway, duplicating it.
  timeoutSeconds: 30
  llmTimeoutSeconds: 180

  hindsight:
    # MEMORY_HINDSIGHT_URL. Required. Points at a Hindsight instance this
    # chart does not run.
    url: ""
    # MEMORY_HINDSIGHT_API_KEY, as a plain value. Leave empty and set
    # apiKeySecret below instead if the key should not live in values.yaml.
    apiKey: ""
    apiKeySecret:
      name: ""
      key: "api-key"

  # MEMORY_MCP_ALLOWED_HOSTS as a list of hostnames (or host:port for a
  # non-default port -- see deploy/helm/README.md, this is the #1 measured
  # MCP failure mode: the SDK's DNS-rebinding guard matches Host including
  # the port, so a wrong value here means every MCP call gets
  # 421 Misdirected Request while REST keeps working fine). Leave empty to
  # default from ingress.host when ingress.enabled is true, or to fall back
  # to the service's own default ("127.0.0.1,localhost") otherwise.
  mcpAllowedHosts: []

  # External identity providers (SPEC §5.3). Both may be enabled at once: the
  # JWT is primary and the platform header is the fallback. With both off --
  # the default -- the service accepts only its own `mem_` keys, exactly as it
  # behaved before they existed.
  auth:
    jwt:
      # MEMORY_AUTH_JWT_ENABLED.
      enabled: false
      # MEMORY_AUTH_JWT_ISSUER. Must match the token's `iss` claim EXACTLY, so
      # it stays the public URL even when jwksUri below is in-cluster -- ACH
      # sets `iss` to its own ACH_BASE_URL verbatim.
      issuer: ""
      # MEMORY_AUTH_JWT_JWKS_URI. Derived from issuer when empty. Override to
      # fetch keys in-cluster, or for Dex, which publishes at /keys rather
      # than /.well-known/jwks.json.
      jwksUri: ""
      # MEMORY_AUTH_JWT_AUDIENCE. Comma-separated: one token may name this
      # service reached directly and the same service reached through a vmcp
      # aggregator under another `aud`.
      audience: ""
      # MEMORY_AUTH_JWT_VERIFY_AUDIENCE. Off accepts any token from the
      # issuer regardless of who it was minted for, which permits
      # cross-service token replay between services sharing an issuer.
      verifyAudience: true
      # MEMORY_AUTH_JWT_GROUPS_CLAIM. Dex emits `groups`; ACH emits none yet,
      # and an absent claim is simply no groups.
      groupsClaim: "groups"
    platform:
      # MEMORY_AUTH_PLATFORM_ENABLED. Resolves a platform API key to an
      # identity over HTTP -- LiteLLM forwards its own key rather than a
      # token we can verify offline, so identity needs a round trip.
      enabled: false
      # MEMORY_AUTH_PLATFORM_INCOMING_HEADER / _RESOLVER_HEADER / _RESOLVER_URL.
      incomingHeader: ""
      resolverHeader: ""
      resolverUrl: ""
      # MEMORY_AUTH_PLATFORM_CACHE_TTL. Successes only -- a rejection is never
      # cached, or a re-enabled key would stay refused for the whole window.
      cacheTtl: 300
      # MEMORY_AUTH_PLATFORM_USER_FIELD / _GROUPS_FIELD. Where the identity and
      # the groups sit in the resolver's JSON. Dotted paths, so a wrapped answer
      # is addressable -- `info.user_id` reads {"info": {"user_id": ...}}. For
      # groups a bare string and a list of strings are both accepted.
      #
      # Both are REQUIRED when platform auth is on, and neither has a default,
      # because there is no standard to default to:
      #
      #   LiteLLM /v2/user/info        user_id        teams      (list)
      #   LiteLLM /key/info            info.user_id   info.team_id
      #   alitellm-auth whoami         user_id        team_id
      #
      # A default would be right for one and silently wrong for the others --
      # and wrong the dangerous way, since a groups path matching nothing still
      # authenticates the caller and merely leaves them with no membership, so
      # every group-owned project stops authorizing with no error anywhere.
      # Demanding both makes that a refusal to start instead.
      userField: ""
      groupsField: ""

# MEMORY_MASTER_KEY_HASH. Never set this as a plain values.yaml string -- it
# is the credential that reaches every bank in the tenant. Set exactly one of:
#   - name:  an existing Secret's name, already containing the hash (recommended)
#   - value: a plaintext hash the chart will create a Secret from
# Rendering fails if neither is set (see templates/secret-master-key.yaml).
masterKeySecret:
  name: ""
  key: "master-key-hash"
  value: ""

migration:
  # Runs `python -m alembic upgrade head` as a pre-install/pre-upgrade Helm
  # hook Job, so it completes before the Deployment is even applied.
  enabled: true
  backoffLimit: 2

# No dedicated /health route ships today; /docs (FastAPI's built-in, no auth
# required) is the same unauthenticated liveness signal scripts/smoke.sh
# already polls -- 200 once the app is serving requests. It does not check
# database or Hindsight connectivity.
#
# startupProbe gates liveness/readiness until the container has had up to
# startupPeriodSeconds * startupFailureThreshold (150s) to answer once, so a
# cold image or slow DB DNS on first boot cannot be killed by liveness's
# initialDelaySeconds/failureThreshold budget below (that pair only starts
# counting once startupProbe has already succeeded once).
probes:
  path: /docs
  initialDelaySeconds: 5
  periodSeconds: 10
  startupPeriodSeconds: 5
  startupFailureThreshold: 30

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: ""
  host: ""
  annotations: {}
  tls: []

# Both images run as uid 10001 (see the Dockerfiles). These defaults are the
# four settings Pod Security Admission's `restricted` profile requires -- with
# them the chart installs on an enforcing cluster; without them it is rejected
# outright. Overriding runAsUser means overriding the image too.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

# readOnlyRootFilesystem is deliberately absent: uvicorn and psycopg want a
# writable /tmp, so enabling it needs an emptyDir mount as well. Add both
# together or neither.
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

# Unset (resources: {}) makes every pod BestEffort QoS: the scheduler treats
# it as free to pack anywhere, and the kubelet evicts BestEffort pods FIRST
# under node memory pressure -- for a memory service that means it is the
# first thing killed on any node it lands on. Tune these for your workload;
# do not remove them back to {}.
#
# No limits.cpu: any CPU request already promotes the pod out of BestEffort
# to Burstable, which is the only QoS goal here -- a CPU limit adds nothing
# to that. What it does add is throttling: the kernel's CFS bandwidth
# controller enforces a CPU limit in fixed ~100ms periods, so a request
# burst gets throttled even when the node has idle CPU to spare. This
# service's hot path is a synchronous API making outbound HTTP calls to an
# LLM-backed upstream -- exactly where a throttling-induced tail-latency
# spike hurts most.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi
nodeSelector: {}
tolerations: []
affinity: {}
