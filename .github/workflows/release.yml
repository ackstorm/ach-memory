name: Release

# A maintainer explicitly hands a verified marker commit to this workflow;
# direct tag pushes are forbidden so no tag can publish an unreviewed commit.
#
# workflow_run, not push: on push these two workflows raced, and Release does
# not depend on CI, so a red CI could not stop a publish. v0.2.0 shipped that
# way -- the image smoke test was failing on the very commit it published.
# Waiting for CI to COMPLETE and requiring success below closes that.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    # Both halves matter: the marker says this commit was meant to publish, and
    # the conclusion says the commit is publishable.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
      && startsWith(github.event.workflow_run.head_commit.message, 'chore(release): v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Elevated HERE and nowhere else: the lint/test/image jobs in ci.yml run
    # repository-controlled code (ruff, pytest, docker build) and must never
    # hold a token that can write packages.
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          # workflow_run defaults to the default branch's tip, NOT the commit
          # CI just verified. Without this a push landing between the two would
          # be what actually gets tagged and published.
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4  # v4

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # Helm's OCI client keeps its own credential store (~/.config/helm/registry),
          # separate from docker's -- `docker login` above does not cover `helm push`.
          printf '%s' "$GITHUB_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Derive and validate the release version
        env:
          RELEASE_MARKER: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          if ! printf '%s' "$RELEASE_MARKER" | grep -Eq '^chore\(release\): v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "FAIL: marker '${RELEASE_MARKER}' is not an exact release marker." >&2
            echo "Expected exactly chore(release): vMAJOR.MINOR.PATCH[-prerelease]." >&2
            exit 1
          fi
          version="${RELEASE_MARKER#chore(release): v}"
          # SemVer, optionally with a pre-release, but NOT build metadata:
          # `+` is valid in SemVer and ILLEGAL in an OCI tag, so a v1.0.0+build.5
          # tag would die inside `docker build` with a bare "invalid reference
          # format" that names neither the tag nor the cause. Helm does not
          # enforce SemVer at package time either -- `--version 1` succeeds --
          # so without this a tag like `v1` publishes silently as version "1".
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "FAIL: marker '${RELEASE_MARKER}' does not yield a publishable version." >&2
            echo "Expected exactly chore(release): vMAJOR.MINOR.PATCH[-prerelease]." >&2
            echo "Build metadata (+...) is not supported: it is illegal in an OCI tag." >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "publishing version ${version}"

      - name: Build and push the service image
        run: |
          image="ghcr.io/ackstorm/ach-memory"
          docker build --build-arg GIT_SHA="${GITHUB_SHA}" -t "${image}:${VERSION}" .
          docker push "${image}:${VERSION}"

      # No Hindsight image published. CUT 2026-08-23 as YAGNI: it is a
      # fourteen-line wrapper around `pip install hindsight-api==0.9.1`, which
      # anyone can build in seconds from a Dockerfile that is in the chart's
      # documentation. Publishing it buys convenience nobody has asked for and
      # adds a third artifact to keep versioned, scanned and public. Add it
      # when someone actually wants to pull it.

      - name: Push the Helm chart as an OCI artifact
        run: |
          helm package deploy/helm/ach-memory --version "${VERSION}" --app-version "${VERSION}"
          helm push "ach-memory-${VERSION}.tgz" \
            "oci://ghcr.io/ackstorm/charts"

      # A pre-existing tag makes a re-run safe; another tag failure still
      # fails the release rather than hiding a publication problem.
      - name: Create and push the release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "tag v${VERSION} already exists, skipping"
          else
            git tag -a "v${VERSION}" -m "v${VERSION}"
            git push origin "v${VERSION}"
          fi

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${VERSION}" --title "v${VERSION}" --generate-notes

      # No provenance attestation. CUT 2026-08-23 as YAGNI: it is supply-chain
      # ceremony for an artifact with no external consumers yet, and nobody
      # has asked to verify it. Digest-pinned bases (Dockerfile/Dockerfile
      # .hindsight) and SHA-pinned actions (ci.yml, this file) earn their
      # place because they make a published version reproducible; an
      # attestation nobody checks does not. Add
      # `actions/attest-build-provenance` (and its `id-token: write`) the
      # first time a consumer asks.
