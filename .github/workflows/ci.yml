name: CI

on:
  # push matters more than pull_request here: this repository's history is
  # linear direct commits to main, so a PR-only trigger meant the image gate
  # below -- the one that catches a mis-grouped dependency before it ships --
  # had never run on the branch that ships.
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege. Without this the token inherits the repository default,
# which on older repos is read/write across contents and packages -- held by
# three jobs that all execute repository-controlled code (ruff, pytest,
# docker build).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          enable-cache: true
          # Pinned to match both Dockerfiles (python:3.12-slim). Unpinned, uv
          # resolves whatever it finds or downloads -- so a change relying on
          # 3.13 behaviour passes here and fails inside the shipped image.
          python-version: "3.12"
      - run: uv run --frozen ruff check .

  # Renders the chart the README documents as part of this build. Catches
  # the class of defect an image/values.yaml mismatch can introduce (a bad
  # default that lints clean but never renders, or a rendered manifest
  # missing a value it required) before anyone runs `helm install` by hand.
  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4  # v4
      - run: helm lint deploy/helm/ach-memory
      - name: helm template must refuse with no master key
        run: |
          if helm template t deploy/helm/ach-memory \
            --set config.databaseUrl=postgresql+psycopg://u:p@h:5432/m \
            --set config.hindsight.url=http://hindsight:8888 >/dev/null 2>&1
          then
            echo "FAIL: the chart rendered with no master key configured" >&2
            exit 1
          fi
          echo "correctly refused"
      - name: helm template with a master key must render hardened manifests
        run: |
          helm template ach-memory deploy/helm/ach-memory \
            --set image.repository=ghcr.io/ackstorm/ach-memory \
            --set config.databaseUrl=postgresql+psycopg://u:p@h:5432/m \
            --set config.hindsight.url=http://hindsight:8888 \
            --set masterKeySecret.value=deadbeef > /tmp/rendered.yaml

          fail=0
          count=$(grep -c 'securityContext:' /tmp/rendered.yaml || true)
          if [ "$count" -lt 4 ]; then
            echo "FAIL: expected at least 4 securityContext: blocks (pod + container, Deployment + migration Job), found $count" >&2
            fail=1
          fi
          if ! grep -q 'runAsNonRoot: true' /tmp/rendered.yaml; then
            echo "FAIL: runAsNonRoot: true not found in rendered manifests" >&2
            fail=1
          fi
          if ! grep -q 'runAsUser: 10001' /tmp/rendered.yaml; then
            echo "FAIL: runAsUser: 10001 not found in rendered manifests" >&2
            fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1
          echo "rendered manifests contain the required hardening blocks"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: memory
          POSTGRES_PASSWORD: memory
          POSTGRES_DB: memory
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U memory"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      # conftest.py connects to the server's "postgres" maintenance database
      # to create memory_test itself -- it does not need POSTGRES_DB above to
      # match, only the same user/password.
      MEMORY_TEST_DATABASE_URL: postgresql+psycopg://memory:memory@localhost:5432/memory_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          enable-cache: true
          # Pinned to match both Dockerfiles (python:3.12-slim). Unpinned, uv
          # resolves whatever it finds or downloads -- so a change relying on
          # 3.13 behaviour passes here and fails inside the shipped image.
          python-version: "3.12"
      - run: uv run --frozen pytest -m "not integration"

  # The most valuable job here is not the unit tests above -- it's this one.
  # In an earlier plan, `mcp` was declared a dev dependency while production
  # code imported it; the Dockerfile builds with `uv export --no-dev`, so the
  # shipped container crash-looped with ModuleNotFoundError for seven tasks
  # straight, and every one of those tasks was green, because `uv run pytest`
  # always installs the dev group regardless. Nothing automated caught it.
  # This job builds the actual production image and proves it starts.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: memory
          POSTGRES_PASSWORD: memory
          POSTGRES_DB: memory
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U memory"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Build the production image
        run: docker build -t ach-memory:ci .

      # The whole regression guard, in one line: import the production entry
      # points inside the shipped image, with no dev dependency group
      # installed. Fails fast on exactly the class of defect above, before
      # the slower full-container check below even starts.
      - name: Import guard -- production entry points must import cleanly
        run: docker run --rm ach-memory:ci python -c "import memory.api.app, memory.mcp.tools"

      # This import guard alone does NOT cover every production dependency:
      # `alembic` and `psycopg[binary]` are never imported by
      # memory.api.app/memory.mcp.tools (SQLAlchemy imports psycopg lazily,
      # by driver name, when a connection is actually opened), so moving
      # either into [dependency-groups.dev] leaves the guard above green.
      # This step is what would actually fail: the chart's own
      # pre-install/pre-upgrade migration Job runs exactly this command, and
      # it needs alembic + a working psycopg driver to do anything.
      - name: Run database migrations against the Postgres service
        run: |
          docker run --rm --network host \
            -e MEMORY_DATABASE_URL="postgresql+psycopg://memory:memory@localhost:5432/memory" \
            ach-memory:ci python -m alembic upgrade head

      - name: Start the container against the Postgres service
        run: |
          docker run -d --name ach-memory-ci --network host \
            -e MEMORY_DATABASE_URL="postgresql+psycopg://memory:memory@localhost:5432/memory" \
            -e MEMORY_MASTER_KEY_HASH="edc1d6f618e2c53cbcb9f859d548c9ad19f60663eb2a738d5f0a57a9fdca451c" \
            -e MEMORY_HINDSIGHT_URL="http://localhost:1" \
            ach-memory:ci

      # Bounded wait with an explicit failure path -- never `until ...; do
      # sleep; done`: if the container never comes up, that loop hangs
      # forever with no signal. `/docs` used to be the probe here, but it is
      # unauthenticated and touches neither the database nor Hindsight -- it
      # certified an image that could not serve one real request (measured:
      # moving alembic+psycopg to the dev group left /docs green while every
      # other request 500'd). `GET /v1/projects` with a real master key
      # exercises auth AND a live DB round trip through psycopg. The
      # plaintext below is CI-only, matched to the hash passed above
      # (sha256("ci-master-key")); it authenticates nothing outside this job.
      - name: Wait for an authenticated request to answer
        run: |
          for i in $(seq 1 30); do
            # `|| true` is load-bearing: the step's shell is `bash -e`, and
            # curl exits 7 (couldn't connect) for as long as uvicorn has not
            # bound the port -- which is always true on the first attempt,
            # ~0.3s after `docker run -d`. Without it, -e killed the script on
            # attempt 1 and the bounded retry below never ran at all. The
            # bound and the explicit failure path existed; they were simply
            # unreachable.
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "x-ach-memory-key: ci-master-key" \
              http://localhost:8000/v1/projects || true)
            if [ "$code" = "200" ]; then
              echo "answered 200 after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "FAIL: the image never answered an authenticated request within 60s" >&2
          exit 1

      - name: Show the container's own output when it never answered
        if: failure()
        run: docker logs ach-memory-ci

      - name: Container logs (always, for diagnosis)
        if: always()
        run: docker logs ach-memory-ci || true

      - name: Stop the container
        if: always()
        run: docker rm -f ach-memory-ci || true

  # Publishing lives HERE, not in a separate workflow, and the reason is the
  # `needs:` line below. It used to be release.yml on a `workflow_run` trigger,
  # which had to re-derive "was CI green?" from
  # `github.event.workflow_run.conclusion` -- a string that is reset to null
  # when a run is re-run, so on 2026-08-26 a green marker commit produced a
  # Release run that skipped itself and published nothing. Worse, the event was
  # not delivered at all for three consecutive pushes. A `needs:` dependency is
  # not a claim about the gates, it IS the gates: this job cannot start unless
  # every one of them succeeded on THIS commit, and there is no cross-workflow
  # event to go missing.
  #
  # The original reason release.yml avoided `push` still holds and is still
  # honoured: on push the two workflows RACED, so a red CI could not stop a
  # publish (v0.2.0 shipped with a failing image smoke test). Being a job with
  # `needs:` removes the race entirely rather than papering over it.
  publish:
    needs: [lint, chart, test, image]
    # The marker says this commit was MEANT to publish; `needs:` says it is
    # publishable. Direct tag pushes stay forbidden, so no tag can publish an
    # unreviewed commit.
    # Quoted, and not optional: the marker contains ": ", which YAML reads as a
    # mapping separator in a bare scalar -- unquoted, this line fails to parse
    # and takes the whole workflow with it.
    if: "${{ startsWith(github.event.head_commit.message, 'chore(release): v') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Elevated HERE and nowhere else: lint/test/image/chart run
    # repository-controlled code (ruff, pytest, docker build) under the
    # workflow-level `contents: read` and must never hold a token that can
    # write packages.
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          # No `ref:` needed, unlike the old workflow_run version: a push-event
          # job checks out github.sha, which IS the commit the gates above ran
          # on. There is no window for another push to be published instead.

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4  # v4

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # Helm's OCI client keeps its own credential store (~/.config/helm/registry),
          # separate from docker's -- `docker login` above does not cover `helm push`.
          printf '%s' "$GITHUB_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Derive and validate the release version
        env:
          RELEASE_MARKER: ${{ github.event.head_commit.message }}
        run: |
          if ! printf '%s' "$RELEASE_MARKER" | grep -Eq '^chore\(release\): v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "FAIL: marker '${RELEASE_MARKER}' is not an exact release marker." >&2
            echo "Expected exactly chore(release): vMAJOR.MINOR.PATCH[-prerelease]." >&2
            exit 1
          fi
          version="${RELEASE_MARKER#chore(release): v}"
          # SemVer, optionally with a pre-release, but NOT build metadata:
          # `+` is valid in SemVer and ILLEGAL in an OCI tag, so a v1.0.0+build.5
          # tag would die inside `docker build` with a bare "invalid reference
          # format" that names neither the tag nor the cause. Helm does not
          # enforce SemVer at package time either -- `--version 1` succeeds --
          # so without this a tag like `v1` publishes silently as version "1".
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "FAIL: marker '${RELEASE_MARKER}' does not yield a publishable version." >&2
            echo "Expected exactly chore(release): vMAJOR.MINOR.PATCH[-prerelease]." >&2
            echo "Build metadata (+...) is not supported: it is illegal in an OCI tag." >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "publishing version ${version}"

      - name: Build and push the service image
        run: |
          image="ghcr.io/ackstorm/ach-memory"
          docker build --build-arg GIT_SHA="${GITHUB_SHA}" -t "${image}:${VERSION}" .
          docker push "${image}:${VERSION}"

      - name: Push the Helm chart as an OCI artifact
        run: |
          helm package deploy/helm/ach-memory --version "${VERSION}" --app-version "${VERSION}"
          helm push "ach-memory-${VERSION}.tgz" \
            "oci://ghcr.io/ackstorm/charts"

      # A pre-existing tag makes a re-run safe; another tag failure still
      # fails the release rather than hiding a publication problem.
      - name: Create and push the release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "tag v${VERSION} already exists, skipping"
          else
            git tag -a "v${VERSION}" -m "v${VERSION}"
            git push origin "v${VERSION}"
          fi

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${VERSION}" --title "v${VERSION}" --generate-notes
