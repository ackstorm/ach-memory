services:
  postgres:
    # Digest-pinned, matching the base-image reasoning in Dockerfile: a moved
    # tag would make a local dev stack silently diverge from what CI and the
    # published image were built against.
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: memory
      POSTGRES_DB: memory
    ports:
      # Loopback only. This stack is for local development: the credentials
      # below are `memory`/`memory` and the master key the README generates
      # is a dev-only secret, so binding 0.0.0.0 hands anyone routable to
      # this host the whole tenant.
      - "127.0.0.1:${MEMORY_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - memory-pgdata:/var/lib/postgresql/data

  hindsight-db:
    # pgvector, not plain postgres: Hindsight stores embeddings in a vector
    # column and fails at query time with `could not access file "$$libdir/vector"`
    # on a stock image. The failure surfaces as a 500 on the first retain, long
    # after startup looked healthy.
    image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      POSTGRES_USER: hindsight
      POSTGRES_PASSWORD: hindsight
      POSTGRES_DB: hindsight
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hindsight"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - hindsight-pgdata:/var/lib/postgresql/data

  hindsight:
    build:
      context: .
      dockerfile: Dockerfile.hindsight
    depends_on:
      hindsight-db:
        condition: service_healthy
    environment:
      HINDSIGHT_API_DATABASE_URL: postgresql://hindsight:hindsight@hindsight-db:5432/hindsight
      # Explicit LLM wiring. Without these, Hindsight falls back to
      # provider=openai/gpt-4o-mini with no base URL, and the OpenAI SDK then
      # silently picks up whatever OPENAI_BASE_URL happens to be in the ambient
      # environment — which is how a green test on a laptop becomes a red one
      # everywhere else.
      # The host-side knobs are HINDSIGHT_LLM_*, including the provider used
      # by the isolated E2E stack, and deliberately NOT
      # OPENAI_BASE_URL/OPENAI_API_KEY: those are
      # read implicitly by the OpenAI SDK, so they are already set on developer
      # machines. Reusing them satisfies the `:?` guards below with a value
      # nobody chose for this stack -- measured on one such host, it resolved
      # to http://localhost:8787/v1/v1, which is the *container's* localhost,
      # and the stack still reported healthy until the first retain.
      HINDSIGHT_API_LLM_PROVIDER: ${HINDSIGHT_LLM_PROVIDER:-openai}
      HINDSIGHT_API_LLM_BASE_URL: ${HINDSIGHT_LLM_BASE_URL:?set HINDSIGHT_LLM_BASE_URL}/v1
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_LLM_API_KEY:?set HINDSIGHT_LLM_API_KEY}
      # Two models, because retain and reflect want OPPOSITE behavior from one
      # and no available model does both. Measured 2026-08-27 against this
      # stack, both halves:
      #
      #   path                  | Hindsight expects | gemini.gemini-3.7-flash | bedrock gpt-oss-20b
      #   retain_extract_facts  | message content   | BROKEN                  | works
      #   reflect / mental model| a tool call       | works                   | BROKEN
      #
      # The two failures are mirror images and both look like an outage
      # elsewhere. gemini on retain: "Provider returned empty message content
      # (finish_reason=tool_calls, has_tool_calls=True)" — it calls a tool
      # where the fact extractor wants prose, so every retain dies after 4
      # retries while the service still reports healthy. gpt-oss on reflect:
      # "ReflectToolCallError: Reflect requires a tool-calling model ...
      # produced no usable tool call" — the refresh operation fails after 2
      # retries and a mental model keeps serving its previous content, so the
      # only symptom is a digest that silently never updates.
      #
      # gemini.gemini-flash-latest fails retain identically (same alias
      # family). kubeai.gpt-oss-20b times out. bedrock.openai.gpt-oss-120b-1-0
      # also works for retain.
      #
      # Provider and base URL are shared: both models are reached through the
      # same LiteLLM OpenAI-compatible route. Do NOT reach for
      # HINDSIGHT_API_*_LLM_PROVIDER=gemini to "fix" the retain half --
      # hindsight-api 0.9.1 accepts base_url for that provider and drops it
      # (providers/gemini_llm.py, `genai.Client(api_key=...)`), so it talks to
      # generativelanguage.googleapis.com whatever you configure, and a
      # LiteLLM key there is a 400 API_KEY_INVALID.
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_LLM_MODEL:-bedrock.openai.gpt-oss-20b-1-0}
      HINDSIGHT_API_REFLECT_LLM_MODEL: ${HINDSIGHT_REFLECT_LLM_MODEL:-gemini.gemini-3.7-flash}
    ports:
      # Loopback only, and only for scripts/e2e.py -- the `api` service
      # reaches Hindsight in-network at http://hindsight:8888 and does not
      # need this published at all. Hindsight takes MEMORY_HINDSIGHT_API_KEY,
      # which defaults to empty, so anyone who can reach this port talks to
      # every user's and project's bank with no credential.
      - "127.0.0.1:${MEMORY_HINDSIGHT_PORT:-8888}:8888"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8888/openapi.json').status==200 else 1)"
      interval: 5s
      timeout: 5s
      retries: 60

  # Runs to completion before `api` starts. Without this, `docker compose up
  # -d` gives four healthy-looking containers and a stack that 500s on every
  # request against an empty schema -- the failure is only visible in
  # `docker logs`, because api/app.py's handler deliberately never echoes the
  # cause. The chart does the same thing with a pre-install hook Job.
  migrate:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MEMORY_DATABASE_URL: postgresql+psycopg://memory:memory@postgres:5432/memory
    command: ["python", "-m", "alembic", "upgrade", "head"]

  api:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      hindsight:
        condition: service_healthy
    environment:
      MEMORY_DATABASE_URL: postgresql+psycopg://memory:memory@postgres:5432/memory
      MEMORY_MASTER_KEY_HASH: ${MEMORY_MASTER_KEY_HASH:?set MEMORY_MASTER_KEY_HASH}
      MEMORY_HINDSIGHT_URL: http://hindsight:8888
      MEMORY_HINDSIGHT_API_KEY: ${MEMORY_HINDSIGHT_API_KEY:-}
      MEMORY_TENANT_ID: default
      # The SDK's DNS-rebinding guard matches Host including the port. This
      # The default compose path publishes the api on localhost:8000, so that
      # exact host:port must be allowed or every MCP call 421s. The isolated
      # E2E runner publishes a Docker-assigned port and supplies a matching
      # wildcard-port allowlist for loopback only.
      MEMORY_MCP_ALLOWED_HOSTS: ${MEMORY_MCP_ALLOWED_HOSTS:-127.0.0.1,localhost,localhost:8000}
    ports:
      # Loopback only. See the postgres/hindsight services above for why.
      - "127.0.0.1:${MEMORY_API_PORT:-8000}:8000"

  # SPEC Phase 3. Two independent switches, both off by default: selecting
  # the profile (`docker compose --profile capture up`) starts the process,
  # and MEMORY_CAPTURE_WORKER_ENABLED=true is what makes it do any work.
  # Defaulting the flag to true here collapsed those two into one, so the
  # profile alone enabled capture -- and that is not what selecting a
  # profile means anywhere else in this file (SPEC Phase 3 review finding
  # 9). Same stricter two-layer default as production (deploy/helm). No
  # ports: this process serves nothing and has no HTTP surface of its own.
  capture-worker:
    build: .
    profiles: ["capture"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      hindsight:
        condition: service_healthy
    environment:
      # Same database/Hindsight configuration as `api` above -- the worker
      # reads and writes the exact same tables and calls the exact same
      # Hindsight banks, just out of band from any request.
      MEMORY_DATABASE_URL: postgresql+psycopg://memory:memory@postgres:5432/memory
      MEMORY_MASTER_KEY_HASH: ${MEMORY_MASTER_KEY_HASH:?set MEMORY_MASTER_KEY_HASH}
      MEMORY_HINDSIGHT_URL: http://hindsight:8888
      MEMORY_HINDSIGHT_API_KEY: ${MEMORY_HINDSIGHT_API_KEY:-}
      MEMORY_TENANT_ID: default
      MEMORY_CAPTURE_WORKER_ENABLED: ${MEMORY_CAPTURE_WORKER_ENABLED:-false}
      MEMORY_CAPTURE_CORRECTION_REFRESH_ENABLED: ${MEMORY_CAPTURE_CORRECTION_REFRESH_ENABLED:-false}
    command: ["ach-memory", "capture-worker"]

  # SPEC Phase 4's non-persisting profile evaluator. Measurement only: it
  # lists a bank's mental models to find `ach-memory-profile-v1` and asks
  # Hindsight for its own non-persisting refresh preview. It never
  # provisions, updates, issues the real refresh or retains -- upstream or
  # locally -- and it never creates a bank. It also ignores
  # MEMORY_PROFILE_DELIVERY_MODE, which stays legacy: this measures the
  # structured path without switching anything onto it.
  #
  # Compose has no scheduler, so there is nothing nightly about this
  # service. An operator runs it on their own schedule:
  #
  #   MEMORY_PROFILE_CHECK_SCOPE=user MEMORY_PROFILE_CHECK_PROJECT=acme-api \
  #     docker compose --profile profile-evaluation run --rm profile-evaluator
  #
  # No target ships. Both variables default to empty rather than to
  # compose's required-variable form (`:?`), because compose interpolates
  # the whole file before it filters by profile: a `:?` here would break
  # `docker compose config` and `up` for every service in this file, for
  # everyone, whether or not they ever select this profile. Empty is
  # rejected by argparse the moment the container starts, which is the same
  # guarantee one layer later -- an operator must name a target explicitly.
  #
  # Before any structured cutover (MEMORY_PROFILE_DELIVERY_MODE=structured
  # anywhere), the rollout order requires at least SEVEN representative runs
  # per scope and a recorded report of what they measured: token and
  # duration ceilings, schema validity, budget conformance and curated
  # behaviour at least equal to legacy. That is a process requirement for
  # whoever runs this -- nothing here counts runs, and profile-check exiting
  # 0 is not by itself permission to enable structured delivery.
  profile-evaluator:
    build: .
    profiles: ["profile-evaluation"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      hindsight:
        condition: service_healthy
    environment:
      # Same database/Hindsight configuration as `api` above: it reads the
      # same tables and the same Hindsight banks, read-only.
      MEMORY_DATABASE_URL: postgresql+psycopg://memory:memory@postgres:5432/memory
      MEMORY_MASTER_KEY_HASH: ${MEMORY_MASTER_KEY_HASH:?set MEMORY_MASTER_KEY_HASH}
      MEMORY_HINDSIGHT_URL: http://hindsight:8888
      MEMORY_HINDSIGHT_API_KEY: ${MEMORY_HINDSIGHT_API_KEY:-}
      MEMORY_TENANT_ID: default
    command:
      - "ach-memory"
      - "profile-check"
      - "--scope"
      - "${MEMORY_PROFILE_CHECK_SCOPE:-}"
      - "--project"
      - "${MEMORY_PROFILE_CHECK_PROJECT:-}"
      - "--json"

volumes:
  memory-pgdata:
  hindsight-pgdata:
