services:
  postgres:
    # Digest-pinned, matching the base-image reasoning in Dockerfile: a moved
    # tag would make a local dev stack silently diverge from what CI and the
    # published image were built against.
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: memory
      POSTGRES_DB: memory
    ports:
      # Loopback only. This stack is for local development: the credentials
      # below are `memory`/`memory` and the master key the README generates
      # is a dev-only secret, so binding 0.0.0.0 hands anyone routable to
      # this host the whole tenant.
      - "127.0.0.1:${MEMORY_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - memory-pgdata:/var/lib/postgresql/data

  hindsight-db:
    # pgvector, not plain postgres: Hindsight stores embeddings in a vector
    # column and fails at query time with `could not access file "$$libdir/vector"`
    # on a stock image. The failure surfaces as a 500 on the first retain, long
    # after startup looked healthy.
    image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      POSTGRES_USER: hindsight
      POSTGRES_PASSWORD: hindsight
      POSTGRES_DB: hindsight
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hindsight"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - hindsight-pgdata:/var/lib/postgresql/data

  hindsight:
    build:
      context: .
      dockerfile: Dockerfile.hindsight
    depends_on:
      hindsight-db:
        condition: service_healthy
    environment:
      HINDSIGHT_API_DATABASE_URL: postgresql://hindsight:hindsight@hindsight-db:5432/hindsight
      # Explicit LLM wiring. Without these, Hindsight falls back to
      # provider=openai/gpt-4o-mini with no base URL, and the OpenAI SDK then
      # silently picks up whatever OPENAI_BASE_URL happens to be in the ambient
      # environment — which is how a green test on a laptop becomes a red one
      # everywhere else.
      # The host-side knobs are HINDSIGHT_LLM_*, including the provider used
      # by the isolated E2E stack, and deliberately NOT
      # OPENAI_BASE_URL/OPENAI_API_KEY: those are
      # read implicitly by the OpenAI SDK, so they are already set on developer
      # machines. Reusing them satisfies the `:?` guards below with a value
      # nobody chose for this stack -- measured on one such host, it resolved
      # to http://localhost:8787/v1/v1, which is the *container's* localhost,
      # and the stack still reported healthy until the first retain.
      HINDSIGHT_API_LLM_PROVIDER: ${HINDSIGHT_LLM_PROVIDER:-openai}
      HINDSIGHT_API_LLM_BASE_URL: ${HINDSIGHT_LLM_BASE_URL:?set HINDSIGHT_LLM_BASE_URL}/v1
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_LLM_API_KEY:?set HINDSIGHT_LLM_API_KEY}
      # The default is set by the owner and is NOT smoke-verified here: no
      # ./scripts/smoke.sh run has exercised gemini.gemini-3.7-flash against
      # this stack. Treat a fresh stack as unproven until one has.
      # Verified working by real smoke runs: bedrock.openai.gpt-oss-20b-1-0
      # and bedrock.openai.gpt-oss-120b-1-0.
      # Verified BROKEN: gemini.gemini-flash-latest — a sibling alias of the
      # default below — answers with finish_reason=tool_calls and empty
      # message content, which Hindsight's fact extractor rejects: every
      # retain dies after 4 retries while the service still looks healthy.
      # kubeai.gpt-oss-20b times out. If retains fail on the default, that
      # failure mode is the first thing to check.
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_LLM_MODEL:-gemini.gemini-3.7-flash}
    ports:
      # Loopback only, and only for scripts/e2e.py -- the `api` service
      # reaches Hindsight in-network at http://hindsight:8888 and does not
      # need this published at all. Hindsight takes MEMORY_HINDSIGHT_API_KEY,
      # which defaults to empty, so anyone who can reach this port talks to
      # every user's and project's bank with no credential.
      - "127.0.0.1:${MEMORY_HINDSIGHT_PORT:-8888}:8888"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8888/openapi.json').status==200 else 1)"
      interval: 5s
      timeout: 5s
      retries: 60

  # Runs to completion before `api` starts. Without this, `docker compose up
  # -d` gives four healthy-looking containers and a stack that 500s on every
  # request against an empty schema -- the failure is only visible in
  # `docker logs`, because api/app.py's handler deliberately never echoes the
  # cause. The chart does the same thing with a pre-install hook Job.
  migrate:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MEMORY_DATABASE_URL: postgresql+psycopg://memory:memory@postgres:5432/memory
    command: ["python", "-m", "alembic", "upgrade", "head"]

  api:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      hindsight:
        condition: service_healthy
    environment:
      MEMORY_DATABASE_URL: postgresql+psycopg://memory:memory@postgres:5432/memory
      MEMORY_MASTER_KEY_HASH: ${MEMORY_MASTER_KEY_HASH:?set MEMORY_MASTER_KEY_HASH}
      MEMORY_HINDSIGHT_URL: http://hindsight:8888
      MEMORY_HINDSIGHT_API_KEY: ${MEMORY_HINDSIGHT_API_KEY:-}
      MEMORY_TENANT_ID: default
      # The SDK's DNS-rebinding guard matches Host including the port. This
      # The default compose path publishes the api on localhost:8000, so that
      # exact host:port must be allowed or every MCP call 421s. The isolated
      # E2E runner publishes a Docker-assigned port and supplies a matching
      # wildcard-port allowlist for loopback only.
      MEMORY_MCP_ALLOWED_HOSTS: ${MEMORY_MCP_ALLOWED_HOSTS:-127.0.0.1,localhost,localhost:8000}
    ports:
      # Loopback only. See the postgres/hindsight services above for why.
      - "127.0.0.1:${MEMORY_API_PORT:-8000}:8000"

volumes:
  memory-pgdata:
  hindsight-pgdata:
